[project]
name = "data-migration"
version = "0.2.0"
description = "数据迁移项目，支持 SQL Server/XLSX/CSV/JSON 到 MySQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymysql>=1.0.0",
    "python-dotenv>=0.19.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
